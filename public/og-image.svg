<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#040f07"/>
      <stop offset="50%"  stop-color="#0a4a2e"/>
      <stop offset="100%" stop-color="#061c12"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#c9a227"/>
      <stop offset="50%"  stop-color="#f5d060"/>
      <stop offset="100%" stop-color="#c9a227"/>
    </linearGradient>
    <!-- Subtle pattern circles -->
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#c9a227" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#c9a227" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- BG -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Glow -->
  <ellipse cx="900" cy="200" rx="400" ry="300" fill="url(#glow1)"/>
  <ellipse cx="200" cy="500" rx="300" ry="200" fill="url(#glow1)"/>

  <!-- Top gold line -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#gold)"/>
  <!-- Bottom gold line -->
  <rect x="0" y="626" width="1200" height="4" fill="url(#gold)"/>

  <!-- Decorative geometric pattern (Hausa-inspired) -->
  <g opacity="0.06" stroke="#c9a227" stroke-width="1" fill="none">
    <rect x="50" y="50"   width="120" height="120" rx="4"/>
    <rect x="65" y="65"   width="90"  height="90"  rx="2"/>
    <line x1="110" y1="50"  x2="110" y2="170"/>
    <line x1="50"  y1="110" x2="170" y2="110"/>
    <rect x="1030" y="460" width="120" height="120" rx="4"/>
    <rect x="1045" y="475" width="90"  height="90"  rx="2"/>
    <line x1="1090" y1="460" x2="1090" y2="580"/>
    <line x1="1030" y1="520" x2="1150" y2="520"/>
  </g>

  <!-- Logo placeholder box -->
  <rect x="80" y="200" width="160" height="160" rx="20"
        fill="#0d5c38" stroke="#c9a227" stroke-width="2"/>
  <!-- Logo text inside box -->
  <text x="160" y="268" text-anchor="middle" font-family="Georgia, serif"
        font-size="18" font-weight="bold" fill="#c9a227">RIMA</text>
  <text x="160" y="292" text-anchor="middle" font-family="Georgia, serif"
        font-size="18" font-weight="bold" fill="#c9a227">MFB</text>
  <!-- Signal arcs -->
  <path d="M 185 240 Q 200 225 215 230" stroke="#c9a227" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 188 233 Q 205 215 222 222" stroke="#c9a227" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>

  <!-- Main headline -->
  <text x="280" y="255" font-family="Georgia, serif"
        font-size="68" font-weight="bold" fill="white">Rima MFB</text>

  <!-- Gold tagline -->
  <text x="280" y="305" font-family="Georgia, serif"
        font-size="30" font-weight="normal" fill="#c9a227">Made For Us By Us</text>

  <!-- Subtitle -->
  <text x="280" y="355" font-family="Arial, sans-serif"
        font-size="22" fill="rgba(255,255,255,0.65)">CBN Licensed Microfinance Bank · Est. 1992</text>
  <text x="280" y="385" font-family="Arial, sans-serif"
        font-size="22" fill="rgba(255,255,255,0.65)">Gwaranyo LGA, Sokoto State, Northern Nigeria</text>

  <!-- Divider line -->
  <rect x="280" y="410" width="80" height="3" rx="2" fill="url(#gold)"/>

  <!-- Feature pills -->
  <g font-family="Arial, sans-serif" font-size="16">
    <!-- Pill 1 -->
    <rect x="280" y="430" width="160" height="36" rx="18" fill="#0d5c38" stroke="#c9a227" stroke-width="1.5"/>
    <text x="360" y="453" text-anchor="middle" fill="#c9a227" font-weight="600">Qard Hasan</text>
    <!-- Pill 2 -->
    <rect x="454" y="430" width="160" height="36" rx="18" fill="#0d5c38" stroke="#c9a227" stroke-width="1.5"/>
    <text x="534" y="453" text-anchor="middle" fill="#c9a227" font-weight="600">Murabaha</text>
    <!-- Pill 3 -->
    <rect x="628" y="430" width="140" height="36" rx="18" fill="#0d5c38" stroke="#c9a227" stroke-width="1.5"/>
    <text x="698" y="453" text-anchor="middle" fill="#c9a227" font-weight="600">USSD *737#</text>
    <!-- Pill 4 -->
    <rect x="782" y="430" width="160" height="36" rx="18" fill="#0d5c38" stroke="#c9a227" stroke-width="1.5"/>
    <text x="862" y="453" text-anchor="middle" fill="#c9a227" font-weight="600">2,000 POS</text>
  </g>

  <!-- Bottom bar -->
  <rect x="0" y="530" width="1200" height="96" fill="rgba(0,0,0,0.3)"/>
  <text x="80" y="575" font-family="Arial, sans-serif" font-size="18"
        fill="rgba(255,255,255,0.5)">Bankin Musulunci · Shariah-Compliant Banking · rimamfb.com</text>
  <text x="80" y="602" font-family="Arial, sans-serif" font-size="15"
        fill="rgba(255,255,255,0.3)">Licensed by the Central Bank of Nigeria (CBN) · Deposits insured by NDIC up to ₦500,000</text>

  <!-- Right side URL badge -->
  <rect x="970" y="550" width="180" height="44" rx="22" fill="url(#gold)"/>
  <text x="1060" y="578" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="17" font-weight="bold" fill="#061c12">rimamfb.com</text>
</svg>
