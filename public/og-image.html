<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    background: linear-gradient(135deg, #040f07 0%, #0a4a2e 50%, #061c12 100%);
    font-family: Georgia, serif;
    position: relative;
  }
  .top-bar { position: absolute; top: 0; left: 0; right: 0; height: 6px;
    background: linear-gradient(90deg, #c9a227, #f5d060, #c9a227); }
  .bottom-bar { position: absolute; bottom: 0; left: 0; right: 0; height: 6px;
    background: linear-gradient(90deg, #c9a227, #f5d060, #c9a227); }
  .glow1 { position: absolute; right: -100px; top: -100px;
    width: 500px; height: 500px; border-radius: 50%;
    background: radial-gradient(circle, rgba(201,162,39,0.12) 0%, transparent 70%); }
  .glow2 { position: absolute; left: -80px; bottom: -80px;
    width: 400px; height: 400px; border-radius: 50%;
    background: radial-gradient(circle, rgba(13,92,56,0.4) 0%, transparent 70%); }
  .logo-box {
    position: absolute; left: 80px; top: 50%; transform: translateY(-50%);
    width: 150px; height: 150px; border-radius: 20px;
    background: #0d5c38; border: 2.5px solid #c9a227;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  }
  .logo-text { color: #c9a227; font-size: 26px; font-weight: bold; letter-spacing: 2px; }
  .logo-sub { color: rgba(201,162,39,0.6); font-size: 11px; letter-spacing: 3px; text-transform: uppercase; }
  .signal { position: absolute; top: 28px; right: 28px; }
  .signal span {
    display: block; border: 2px solid #c9a227; border-radius: 50%;
    margin-bottom: 3px;
  }
  .content { position: absolute; left: 270px; top: 50%; transform: translateY(-50%); }
  .title { color: white; font-size: 62px; font-weight: bold; line-height: 1.1; margin-bottom: 10px; }
  .tagline { color: #c9a227; font-size: 28px; margin-bottom: 14px; }
  .divider { width: 80px; height: 3px; background: linear-gradient(90deg, #c9a227, #f5d060); border-radius: 2px; margin-bottom: 14px; }
  .sub { color: rgba(255,255,255,0.65); font-family: Arial, sans-serif; font-size: 19px; margin-bottom: 5px; }
  .pills { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
  .pill {
    padding: 7px 18px; border-radius: 20px;
    border: 1.5px solid #c9a227; background: #0d5c38;
    color: #c9a227; font-family: Arial, sans-serif; font-size: 14px; font-weight: 600;
  }
  .footer {
    position: absolute; bottom: 12px; left: 80px; right: 80px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .footer-left { color: rgba(255,255,255,0.35); font-family: Arial, sans-serif; font-size: 13px; }
  .domain-badge {
    background: linear-gradient(90deg, #c9a227, #f5d060);
    color: #061c12; font-family: Arial, sans-serif;
    font-size: 15px; font-weight: bold;
    padding: 8px 22px; border-radius: 20px;
  }
</style>
</head>
<body>
  <div class="top-bar"></div>
  <div class="glow1"></div>
  <div class="glow2"></div>
  <div class="logo-box">
    <div class="logo-text">RIMA</div>
    <div class="logo-text" style="margin-top:-8px">MFB</div>
    <div class="logo-sub">Est. 1992</div>
  </div>
  <div class="content">
    <div class="title">Rima MFB</div>
    <div class="tagline">Made For Us By Us</div>
    <div class="divider"></div>
    <div class="sub">CBN Licensed · Est. 1992 · Sokoto State</div>
    <div class="sub">Shariah-Compliant Microfinance Bank</div>
    <div class="pills">
      <div class="pill">Qard Hasan</div>
      <div class="pill">Murabaha</div>
      <div class="pill">USSD *737#</div>
      <div class="pill">2,000 POS</div>
    </div>
  </div>
  <div class="footer">
    <div class="footer-left">Licensed by CBN · Deposits insured by NDIC up to ₦500,000 · rimabank.ng</div>
    <div class="domain-badge">rimabank.ng</div>
  </div>
  <div class="bottom-bar"></div>
</body>
</html>
